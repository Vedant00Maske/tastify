# Alert routing (docker-compose.prod.yml, profile "monitoring"; RUNBOOK.md "Alerts").
#
# By default alerts are only visible in Alertmanager (http://127.0.0.1:9093 on the host). To be
# notified by e-mail, fill in the `email` receiver below (the same SMTP account as the app works)
# and change the route's receiver to "email". Keep this file's secrets out of git: copy it to
# alertmanager.local.yml, edit that, and point the compose file at it.

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
  # - name: email
  #   email_configs:
  #     - to: ops@example.com
  #       from: alerts@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: alerts@example.com
  #       auth_password: change-me
  #       require_tls: true

inhibit_rules:
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname=~"HighErrorRate|ApiLatencyHigh|RecommendationLatencyHigh"']
    equal: []
