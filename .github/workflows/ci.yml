name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend-quality:
    name: Backend · lint, format, types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy app tests alembic/env.py

  backend-tests:
    name: Backend · migrations & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tastify
          POSTGRES_PASSWORD: tastify
          POSTGRES_DB: tastify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tastify -d tastify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tastify:tastify@127.0.0.1:5432/tastify_test
      TEST_DATABASE_URL: postgresql+asyncpg://tastify:tastify@127.0.0.1:5432/tastify_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply, roll back and re-apply on a clean database
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  ml:
    name: ML · lint, types, pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tastify
          POSTGRES_PASSWORD: tastify
          POSTGRES_DB: tastify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tastify -d tastify_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tastify:tastify@127.0.0.1:5432/tastify_test
      TEST_DATABASE_URL: postgresql+asyncpg://tastify:tastify@127.0.0.1:5432/tastify_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ml/requirements*.txt
            backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy tastify_ml tests
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing

  frontend-quality:
    name: Frontend · lint, format, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  frontend-e2e:
    name: Frontend · end-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:install -- --with-deps
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Security · secrets & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history for committed secrets
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          cd ml && pip-audit -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: npm dependency audit (production dependencies, high severity and above)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker · build production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-smoke:
    name: Deploy · production stack smoke test
    # The production compose stack (Caddy, API and recommender replicas, worker, beat, backups)
    # built from this commit and exercised end to end: spec §14 steps 8-9 (DEPLOYMENT.md).
    runs-on: ubuntu-latest
    env:
      COMPOSE: >-
        docker compose -p tastify-smoke -f docker-compose.prod.yml
        -f infrastructure/deployment/docker-compose.smoke.yml
        --env-file infrastructure/deployment/smoke.env
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Shell scripts (deploy, backup, restore, catalogue)
        run: |
          docker run --rm -v "$PWD:/w" -w /w koalaman/shellcheck:v0.10.0 -s sh \
            scripts/deploy.sh infrastructure/backup/*.sh
      - name: Validate edge proxy and monitoring configuration
        run: |
          docker run --rm -e SITE_ADDRESS=tastify.example.com \
            -v "$PWD/infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint promtool \
            -v "$PWD/infrastructure/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "$PWD/infrastructure/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.2 check-config /etc/alertmanager/alertmanager.yml
      - name: Start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: Smoke test through the edge proxy
        run: |
          pip install httpx==0.28.1
          python scripts/smoke_test.py --base http://127.0.0.1:8080 --mailpit http://127.0.0.1:8025
      - name: Backup and restore test
        run: |
          $COMPOSE exec -T backup sh /scripts/backup.sh --once
          $COMPOSE exec -T backup sh /scripts/verify.sh
      - name: Production settings are refused when unsafe
        run: |
          if $COMPOSE run --rm -e ENVIRONMENT=production api python -c "import app.main"; then
            echo "the API started in production with smoke-test settings" >&2
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes --remove-orphans
