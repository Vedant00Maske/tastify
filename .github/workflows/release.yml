name: Release

# A version tag (v1.2.3) builds and publishes the production images to the GitHub Container
# Registry, then deploys them after approval (spec §14 step 10; DEPLOYMENT.md, RUNBOOK.md).
#
# Deployment needs, in the repository settings:
# - an environment named "production" with required reviewers (the approval step),
# - variables DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (the server's checkout),
# - secrets DEPLOY_SSH_KEY (a key allowed to log in) and DEPLOY_KNOWN_HOSTS (the server's host
#   key line, from `ssh-keyscan <host>`, checked rather than trusted on first use).
# Without DEPLOY_HOST the images are still published and the deploy job is skipped.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and deploy (e.g. v0.7.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        name: Version and registry
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $tag" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/soniqueo-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/soniqueo-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/soniqueo-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/soniqueo-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production
    needs: images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$TARGET" \
            "cd '$DEPLOY_PATH' && git fetch --quiet --tags origin && git checkout --quiet --detach '$TAG' && sh scripts/deploy.sh '$TAG'"
