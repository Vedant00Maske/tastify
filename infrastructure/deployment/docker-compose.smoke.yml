# Smoke-test overlay for docker-compose.prod.yml: the production stack on plain HTTP with a
# local mail catcher, for CI and for trying a deployment locally (DEPLOYMENT.md "Smoke test").
#
#   docker compose -p soniqueo-smoke -f docker-compose.prod.yml \
#     -f infrastructure/deployment/docker-compose.smoke.yml \
#     --env-file infrastructure/deployment/smoke.env up -d --build --wait
#   python scripts/smoke_test.py --base http://127.0.0.1:8080 --mailpit http://127.0.0.1:8025
#
# Never use these settings for real users: staging over HTTP, test passwords.

x-smoke-env: &smoke-env
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURITY: none
  SESSION_COOKIE_SECURE_OVERRIDE: "false"

services:
  api:
    env_file:
      - path: infrastructure/deployment/smoke.env
    environment:
      <<: *smoke-env
  recommender:
    env_file:
      - path: infrastructure/deployment/smoke.env
    environment:
      <<: *smoke-env
  worker:
    env_file:
      - path: infrastructure/deployment/smoke.env
    environment:
      <<: *smoke-env
      BACKUP_STATUS_FILE: /backups/last_success
  beat:
    env_file:
      - path: infrastructure/deployment/smoke.env
    environment:
      <<: *smoke-env
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [internal]
