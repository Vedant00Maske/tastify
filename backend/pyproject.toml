[project]
name = "soniqueo-backend"
version = "0.1.0"
description = "SONIQUEO API, domain services and background workers."
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt and requirements-dev.txt (see ADR-011).
# The runtime pins are repeated here for installers that read pyproject.toml rather than
# requirements.txt (Vercel's Python runtime); tests/unit/test_dependency_pins.py keeps them equal.
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "celery[redis]==5.7.0",
  "cryptography==50.0.2",
  "fastapi==0.163.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pgvector==0.5.1",
  "prometheus-client==0.26.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "redis==8.1.0",
  "sentry-sdk[fastapi,celery]==2.74.0",
  "SQLAlchemy[asyncio]==2.1.9",
  "uvicorn[standard]==0.54.0",
]

# Vercel (vercel.json at the repository root): the ASGI application.
[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "S",     # flake8-bandit (security)
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
  "PT",    # flake8-pytest-style
  "T20",   # no print statements
  "ASYNC", # flake8-async
  "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and invoke subprocesses (alembic) with trusted arguments.
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations directory would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
# One event loop for the whole run: the module-level engine and Redis client bind to it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs running PostgreSQL and Redis (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
