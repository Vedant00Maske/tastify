# Production (and staging) stack. Usage: docs/DEPLOYMENT.md, docs/RUNBOOK.md
#
#   cp .env.production.example .env.production      # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --wait
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile monitoring up -d
#
# Only Caddy publishes ports (80/443). PostgreSQL, Redis, the apps and the monitoring services
# are reachable only on the internal network; Grafana and Prometheus bind to 127.0.0.1 on the
# host (use an SSH tunnel).

# A separate project name: never share volumes with the development stack (docker-compose.yml).
name: tastify-prod

x-backend: &backend
  # Built once (by the migrate service below) or pulled when BACKEND_IMAGE names a registry
  # image; every backend service runs the same image.
  image: ${BACKEND_IMAGE:-tastify-backend:local}
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: false
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-production}
    LOG_FORMAT: json
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tastify}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tastify}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    # Caddy (and only Caddy) sits in front of the API on this network.
    TRUSTED_PROXIES: '["172.28.0.0/16"]'
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  networks: [internal]

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. tastify.example.com}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      recommender:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  frontend:
    image: ${FRONTEND_IMAGE:-tastify-frontend:local}
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      # Caddy routes /api/v1 straight to the API; this is the fallback for anything the Next.js
      # server itself proxies.
      API_PROXY_TARGET: http://api:8000
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks: [internal]

  migrate:
    <<: *backend
    build:
      context: ./backend
      target: prod
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # General API: accounts, catalogue, playlists, feedback, integrations.
  api:
    <<: *backend
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The same image, serving /api/v1/recommendations/* only (Caddy routes by path): CPU-heavy
  # ranking cannot slow down sign-in, search or playlists, and each side scales on its own.
  recommender:
    <<: *backend
    deploy:
      replicas: ${RECOMMENDER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--pool", "threads",
       "--concurrency", "${WORKER_CONCURRENCY:-4}", "--loglevel", "INFO"]
    environment:
      <<: *backend-env
      BACKUP_STATUS_FILE: /backups/last_success
    volumes:
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app:celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    # Exactly one scheduler per deployment. Its schedule state lives in /tmp (tmpfs): a restart
    # simply recomputes the next run of each daily job.
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel", "INFO",
       "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      # The scheduler process (PID 1) is alive; its jobs' outcomes are monitored as metrics.
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tastify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tastify}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - idle_in_transaction_session_timeout=60000
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/deployment/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Cache entries and counters expire; under memory pressure only keys with an expiry are
    # evicted, never the job queue. Append-only persistence survives restarts.
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes",
       "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging
    networks: [internal]

  # Daily PostgreSQL backups to the `backups` volume (copy them off the host: RUNBOOK.md).
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tastify}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tastify}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - backups:/backups
    healthcheck:
      # Healthy once a backup exists and the newest is less than 26 hours old.
      test: ["CMD", "sh", "/scripts/healthcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  # --- Monitoring (optional: --profile monitoring) -------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *logging
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./infrastructure/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    logging: *logging
    networks: [internal]

  grafana:
    image: grafana/grafana:13.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    logging: *logging
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  backups:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  grafana-data:
